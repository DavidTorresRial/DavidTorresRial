name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#4f46e5&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#4f46e5
            dist/snake-dark.svg?palette=github-dark&color_snake=#818cf8&color_dots=#161b22,#312e81,#4338ca,#6366f1,#a5b4fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
